# A single-node SeaweedFS with S3 authentication on, so the E2E suite checks
# press's presigned uploads against a real S3 implementation. Anonymous
# users may only read, which is how visitors fetch Prints.
apiVersion: v1
kind: Namespace
metadata:
  name: storage-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3
  namespace: storage-e2e
data:
  s3.json: |
    {
      "identities": [
        {"name": "anonymous", "actions": ["Read"]},
        {
          "name": "manifesto",
          "credentials": [{"accessKey": "manifesto", "secretKey": "manifesto-e2e-secret"}],
          "actions": ["Admin", "Read", "List", "Tagging", "Write"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: storage-e2e
spec:
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:4.52
        command: ["weed"]
        args:
        - server
        - -dir=/data
        - -ip.bind=0.0.0.0
        - -master.volumeSizeLimitMB=64
        - -s3
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json
        ports:
        - {name: s3, containerPort: 8333}
        readinessProbe:
          tcpSocket: {port: s3}
          periodSeconds: 3
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: config, mountPath: /etc/seaweedfs}
      volumes:
      - name: data
        emptyDir: {}
      - name: config
        configMap: {name: seaweedfs-s3}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: storage-e2e
spec:
  selector: {app: seaweedfs}
  ports:
  - {name: s3, port: 8333, targetPort: s3}
