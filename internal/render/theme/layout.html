<!doctype html>
<html lang="{{ with .Gazette.Language }}{{ . }}{{ else }}en{{ end }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ block "title" . }}{{ .Gazette.Title }}{{ end }}</title>
<style>{{ asset "style.css" }}</style>
</head>
<body>
<header>
<a class="site" href="/">{{ .Gazette.Title }}</a>
{{ with .Gazette.Tagline }}<p class="tagline">{{ . }}</p>{{ end }}
</header>
<main>
{{ block "content" . }}{{ end }}
</main>
</body>
</html>
