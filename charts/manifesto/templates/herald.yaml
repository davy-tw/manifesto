{{- $h := .Values.herald }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifesto-herald
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manifesto.componentLabels" (list $ "herald") | nindent 4 }}
spec:
  {{- if not $h.autoscaling.enabled }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: manifesto
      app.kubernetes.io/component: herald
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manifesto
        app.kubernetes.io/component: herald
    spec:
      serviceAccountName: manifesto-herald
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- include "manifesto.podScheduling" (list $ $h) | nindent 6 }}
      containers:
      - name: herald
        image: {{ include "manifesto.image" (list $ $h.image) }}
        imagePullPolicy: {{ $h.image.pullPolicy }}
        command: [/manager]
        args:
        - --bind-address=:8080
        - {{ printf "--cache-control=%s" (required "herald.cacheControl is required" $h.cacheControl) | quote }}
        {{- range $h.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        ports:
        - {name: http, containerPort: 8080, protocol: TCP}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
        resources:
          {{- toYaml $h.resources | nindent 10 }}
        securityContext:
          {{- include "manifesto.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: manifesto-herald
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manifesto.componentLabels" (list $ "herald") | nindent 4 }}
spec:
  ports:
  - {name: http, port: 80, protocol: TCP, targetPort: http}
  selector:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/component: herald
{{- if $h.autoscaling.enabled }}
{{- $as := $h.autoscaling }}
{{- if not (or $as.targetCPUUtilizationPercentage $as.targetMemoryUtilizationPercentage) }}
{{- fail "herald.autoscaling needs targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage" }}
{{- end }}
{{- if gt (int $as.minReplicas) (int $as.maxReplicas) }}
{{- fail "herald.autoscaling.minReplicas must not exceed maxReplicas" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manifesto-herald
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manifesto.componentLabels" (list $ "herald") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: manifesto-herald
  minReplicas: {{ $h.autoscaling.minReplicas }}
  maxReplicas: {{ $h.autoscaling.maxReplicas }}
  metrics:
  {{- with $h.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: {{ . }}}
  {{- end }}
  {{- with $h.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target: {type: Utilization, averageUtilization: {{ . }}}
  {{- end }}
  {{- with $h.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $h.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: manifesto-herald
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manifesto.componentLabels" (list $ "herald") | nindent 4 }}
spec:
  maxUnavailable: {{ $h.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: manifesto
      app.kubernetes.io/component: herald
{{- end }}
