# Manifesto installs into the release namespace (create it first, e.g.
# manifesto-system). Resources keep the names the kustomize install uses
# (manifesto-*), so install the chart once per cluster: press works across
# all namespaces, and people are granted the cluster roles
# manifesto-proofreader, manifesto-editor and manifesto-publisher by name.

# imageRegistry is prepended to every image repository: the released images
# are ghcr.io/davy-tw/manifesto-<component>. Set it to "" for images
# imported into the nodes (docs/k3s.md) or to your own registry.
imageRegistry: ghcr.io/davy-tw
imagePullSecrets: []

# press: the operator.
press:
  image:
    repository: manifesto-press
    # tag defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # How many Editions (revisions) to keep per Dispatch; negative stops recording.
  editions: 20
  # How much content to keep in one Dispatch's Editions, so revisions cannot
  # fill etcd (k3s with embedded etcd: 2 GiB by default). 0 means no bound.
  editionBytes: 2Mi
  # How long a Print's upload URL stays valid.
  uploadTTL: 5m
  # Routing: press attaches each Gazette's domain to a Gateway. Leave
  # gatewayName empty to route yourself.
  routing:
    gatewayName: ""
    gatewayNamespace: ""
    # listenerset: a ListenerSet, HTTPRoutes and a Certificate per Gazette.
    # gateway: HTTPRoutes on the Gateway's own listeners (k3s's Traefik).
    mode: listenerset
    # gateway mode: the Gateway listener (sectionName) to attach to.
    gatewaySection: ""
    # listenerset mode: listener ports and the cert-manager ClusterIssuer
    # (perGazette certificates only). listenerHTTPPort 0 leaves out the HTTP
    # listener and its redirect to HTTPS.
    listenerHTTPSPort: 443
    listenerHTTPPort: 80
    clusterIssuer: ""
    # listenerset mode: annotations on every ListenerSet (press's and the
    # chart's desk and darkroom ones), for controllers that read them, e.g.
    # a certificate controller. Keys under cert-manager.io/ cannot be
    # combined with clusterIssuer.
    listenerSetAnnotations: {}
    # listenerset mode: TLS of each HTTPS listener, the chart's desk and
    # darkroom routes included.
    tls:
      # perGazette: Secret manifesto-<gazette>-tls in the Gazette's namespace
      #   (manifesto-<component>-tls for desk and darkroom), signed by
      #   clusterIssuer when set.
      # shared: sharedSecret for every listener, e.g. a wildcard certificate;
      #   press and the chart add the ReferenceGrants that allow it.
      # none: no certificateRefs; the Gateway implementation provides the
      #   certificates, as options tell it.
      certificateRefs: perGazette
      # shared: the Secret, as <namespace>/<name>. Its namespace must exist
      # before install: the chart puts a ReferenceGrant there when desk.route
      # or darkroom.route creates a ListenerSet.
      sharedSecret: ""
      # Copied to each HTTPS listener's tls.options (implementation-specific):
      # at most 16, keys such as example.io/option, values strings.
      options: {}
  extraArgs: []
  resources:
    limits: {cpu: 500m, memory: 128Mi}
    requests: {cpu: 10m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# herald: serves the sites to visitors.
herald:
  image:
    repository: manifesto-herald
    tag: ""
    pullPolicy: IfNotPresent
  # herald keeps no state of its own; every replica watches the API server
  # and holds every site's rendered pages in memory.
  replicas: 2
  # cacheControl is sent with pages, 404s and 410s. The default makes
  # browsers and CDNs revalidate every request with the page's ETag (a 304
  # costs herald almost nothing). Behind a CDN, let it keep pages for a
  # while, e.g. "public, max-age=0, s-maxage=300, stale-while-revalidate=60,
  # stale-if-error=86400": changes then reach visitors up to s-maxage later.
  # That includes retractions: a Retracted or Draft post stays on the CDN for
  # up to s-maxage + stale-while-revalidate, and stale-if-error longer if
  # herald fails meanwhile. Purge the CDN to take a post down at once.
  cacheControl: no-cache
  # autoscaling replaces replicas with a HorizontalPodAutoscaler (needs
  # metrics-server, which k3s ships). Utilization is relative to
  # resources.requests: raise requests.cpu to what one replica really uses
  # before turning it on. Turning it on in an existing release removes
  # replicas from the Deployment, which falls to 1 replica until the
  # autoscaler scales it back: first "kubectl scale deployment
  # manifesto-herald --replicas=<minReplicas>" if that gap matters.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior: {}
  # Keeps all but one replica serving while nodes are drained.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  extraArgs: []
  resources:
    limits: {cpu: 500m, memory: 256Mi}
    requests: {cpu: 10m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# darkroom: stores media for pvc Archives on a ReadWriteOnce volume, so it
# runs one replica and is replaced, not rolled. Disable it when every
# Archive uses S3.
darkroom:
  enabled: true
  image:
    repository: manifesto-darkroom
    tag: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
    # Empty uses the cluster's default StorageClass (local-path on k3s).
    storageClassName: ""
    # existingClaim serves an existing PersistentVolumeClaim instead.
    existingClaim: ""
  # Only press may reach darkroom's internal port.
  networkPolicy: true
  # publicURL is where visitors fetch media, e.g. https://media.example.io:
  # the publicURL of the pvc (Cluster)Archive darkroom serves, and the
  # hostname of its route.
  publicURL: ""
  # route attaches darkroom's public port to the Gateway, as press routes a
  # Gazette (see press.routing): an HTTPRoute in gateway mode; a ListenerSet,
  # HTTPRoutes and a Certificate (with clusterIssuer) in listenerset mode.
  # parentRefs instead attaches only an HTTPRoute to the parents given.
  route:
    enabled: false
    parentRefs: []
  resources:
    limits: {cpu: 500m, memory: 256Mi}
    requests: {cpu: 10m, memory: 32Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# desk: the authors' web UI. It acts with each user's own token and has no
# permissions of its own.
desk:
  enabled: true
  image:
    repository: manifesto-desk
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  # publicURL is desk's address, e.g. https://desk.example.io (required).
  publicURL: ""
  oidc:
    # issuer turns on OIDC sign-in; the API server must trust it too.
    issuer: ""
    clientID: manifesto-desk
    scopes: [openid, email, profile]
    # The client secret, if any, is read from this Secret's clientSecret key.
    clientSecretName: manifesto-desk-oidc
  # tokenSignIn lets users sign in by pasting a token (kubectl create token).
  tokenSignIn: false
  # route attaches desk to the Gateway for publicURL's hostname, as
  # darkroom.route does.
  route:
    enabled: false
    parentRefs: []
  resources:
    limits: {cpu: 500m, memory: 128Mi}
    requests: {cpu: 10m, memory: 32Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
