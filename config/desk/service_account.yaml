# desk acts with each user's own token and has no RBAC of its own. The
# account exists only so desk can find the API server and trust its CA.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/component: desk
    app.kubernetes.io/managed-by: kustomize
  name: desk
  namespace: system
