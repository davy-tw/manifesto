---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  - listenersets
  - referencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - manifesto.davy.tw
  resources:
  - clustertypesets
  - dispatches
  - gazettes
  - scribes
  - sections
  - stamps
  - typesets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - manifesto.davy.tw
  resources:
  - clustertypesets/status
  - dispatches/status
  - gazettes/status
  - sections/status
  - typesets/status
  verbs:
  - get
  - patch
