---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - manifesto.davy.tw
  resources:
  - dispatches
  - gazettes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - manifesto.davy.tw
  resources:
  - dispatches/finalizers
  - gazettes/finalizers
  verbs:
  - update
- apiGroups:
  - manifesto.davy.tw
  resources:
  - dispatches/status
  - gazettes/status
  verbs:
  - get
  - patch
  - update
