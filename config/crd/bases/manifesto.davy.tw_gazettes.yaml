---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gazettes.manifesto.davy.tw
spec:
  group: manifesto.davy.tw
  names:
    categories:
    - manifesto
    kind: Gazette
    listKind: GazetteList
    plural: gazettes
    shortNames:
    - blog
    singular: gazette
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Gazette is a blog site: a publication with its own domain, title and
          branding. A namespace (the publisher) may run several Gazettes, and every
          Dispatch belongs to exactly one of them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the Gazette
            properties:
              domain:
                description: |-
                  domain is the host name visitors use to reach this Gazette, for example
                  "alice.example.io". herald picks the Gazette by the request's Host header.
                  When Gazettes in different namespaces claim the same domain, the oldest
                  one wins and the others report DomainConflict.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              language:
                description: |-
                  language is the BCP 47 language tag of the site's content, for example
                  "zh-TW". It is written to the html lang attribute and the Wire feed.
                maxLength: 35
                pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
                type: string
              logo:
                description: 'logo is the site logo, as a reference to a Print: "print:<name>".'
                maxLength: 259
                pattern: ^print:[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              pageSize:
                description: pageSize is the number of Dispatches per listing page
                  (default 10).
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              tagline:
                description: tagline is a short line shown under the title.
                maxLength: 512
                type: string
              title:
                description: title is the site name shown in page titles, headers
                  and the Wire feed.
                maxLength: 256
                minLength: 1
                type: string
              typesetParams:
                additionalProperties:
                  type: string
                description: typesetParams override the theme's params, available
                  as .Params.
                maxProperties: 64
                type: object
              typesetRef:
                description: |-
                  typesetRef is the theme of the Gazette. Without it, the built-in theme
                  is used.
                properties:
                  kind:
                    default: ClusterTypeset
                    description: kind is Typeset (same namespace) or ClusterTypeset.
                    enum:
                    - Typeset
                    - ClusterTypeset
                    type: string
                  name:
                    description: name of the theme.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - domain
            - title
            type: object
          status:
            description: status is the state of the Gazette as observed by press
            properties:
              conditions:
                description: |-
                  conditions describe the Gazette's current state. "Ready" is True when the
                  Gazette owns its domain and its theme exists and parses; otherwise its
                  reason is DomainConflict, TypesetNotFound or TemplateError.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation that the
                  status reflects.
                format: int64
                type: integer
              url:
                description: url is the public address of the Gazette's front page.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
