---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scribes.manifesto.davy.tw
spec:
  group: manifesto.davy.tw
  names:
    categories:
    - manifesto
    kind: Scribe
    listKind: ScribeList
    plural: scribes
    shortNames:
    - author
    singular: scribe
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Scribe is an author. A Dispatch names its author with spec.scribeRef, and
          herald lists an author's Dispatches at /scribes/<name>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the author
            properties:
              avatar:
                description: 'avatar is the author''s picture, as a reference to a
                  Print: "print:<name>".'
                maxLength: 259
                pattern: ^print:[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              bio:
                description: bio is a short introduction shown on the author's page.
                maxLength: 4096
                type: string
              displayName:
                description: displayName is the author's name as shown to visitors.
                maxLength: 256
                minLength: 1
                type: string
              identities:
                description: |-
                  identities are the Kubernetes user names this author signs in as, for
                  example "oidc:alice@example.io". desk uses them to pick the Scribe of
                  the signed-in user; they grant no permissions.
                items:
                  maxLength: 512
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
            required:
            - displayName
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
