---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: archives.manifesto.davy.tw
spec:
  group: manifesto.davy.tw
  names:
    categories:
    - manifesto
    kind: Archive
    listKind: ArchiveList
    plural: archives
    shortNames:
    - store
    singular: archive
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: PVC claim (empty for S3)
      jsonPath: .spec.pvc.claimName
      name: Backend
      type: string
    - jsonPath: .spec.s3.bucket
      name: Bucket
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Archive is media storage for the Prints of its namespace. Use a
          ClusterArchive for storage shared by every namespace; objects are still
          kept apart per namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is where files are stored
            properties:
              pvc:
                description: pvc stores files on darkroom's PersistentVolume.
                properties:
                  claimName:
                    description: |-
                      claimName is the PersistentVolumeClaim darkroom mounts. press checks
                      that it is the claim its darkroom serves.
                    maxLength: 253
                    minLength: 1
                    type: string
                  publicURL:
                    description: |-
                      publicURL is where visitors reach darkroom, e.g. https://media.example.io.
                      Upload URLs are signed against it as well.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - claimName
                - publicURL
                type: object
              s3:
                description: s3 stores files in an S3-compatible bucket.
                properties:
                  bucket:
                    description: bucket holds the objects.
                    maxLength: 63
                    minLength: 3
                    type: string
                  credentialsSecretRef:
                    description: |-
                      credentialsSecretRef is a Secret with accessKeyID and secretAccessKey.
                      For an Archive it must be in the Archive's namespace; a ClusterArchive
                      names its namespace.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: namespace of the Secret; only used by ClusterArchive.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: endpoint is the S3 API endpoint, e.g. http://seaweedfs-s3.storage.svc:8333.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  pathStyle:
                    default: true
                    description: |-
                      pathStyle addresses the bucket as endpoint/bucket instead of
                      bucket.endpoint, which most self-hosted services need.
                    type: boolean
                  publicURL:
                    description: |-
                      publicURL is where visitors read objects, e.g. a CDN in front of the
                      bucket. Defaults to endpoint/bucket.
                    maxLength: 2048
                    pattern: ^https?://
                    type: string
                  region:
                    default: us-east-1
                    description: region of the bucket. Many S3-compatible services
                      accept any value.
                    maxLength: 64
                    type: string
                required:
                - bucket
                - credentialsSecretRef
                - endpoint
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of s3 or pvc must be set
              rule: has(self.s3) != has(self.pvc)
          status:
            description: status is the state of the Archive as observed by press
            properties:
              conditions:
                description: |-
                  conditions describe the Archive's current state. "Ready" is True when
                  press can sign uploads and check objects in the backend.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation that the
                  status reflects.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
