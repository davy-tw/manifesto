---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stamps.manifesto.davy.tw
spec:
  group: manifesto.davy.tw
  names:
    categories:
    - manifesto
    kind: Stamp
    listKind: StampList
    plural: stamps
    shortNames:
    - tag
    singular: stamp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Stamp is a tag. A Dispatch carries any number of Stamps as labels
          stamp.manifesto.davy.tw/<name>: "". The Stamp resource is optional: it
          adds a display name and a description.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the tag
            properties:
              description:
                description: description is shown on the Stamp's page.
                maxLength: 4096
                type: string
              displayName:
                description: |-
                  displayName is the name shown to visitors. Without it, the Stamp's
                  metadata.name is shown.
                maxLength: 256
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: metadata.name is used in label keys and URLs and must be a DNS
            label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources: {}
