---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dispatches.manifesto.davy.tw
spec:
  group: manifesto.davy.tw
  names:
    categories:
    - manifesto
    kind: Dispatch
    listKind: DispatchList
    plural: dispatches
    shortNames:
    - post
    singular: dispatch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.gazetteRef
      name: Gazette
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.publishedAt
      name: Published
      type: string
    - jsonPath: .spec.publishAt
      name: PublishAt
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Dispatch is an article, published in exactly one Gazette. Its
          metadata.name is the URL slug and its body is stored inline.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the Dispatch
            properties:
              content:
                description: content is the body of the Dispatch.
                properties:
                  body:
                    description: |-
                      body is the article text. Media is referenced as "print:<name>", for
                      example ![cover](print:hero-image).
                    maxLength: 524288
                    type: string
                  format:
                    default: markdown
                    description: format is the markup language of body.
                    enum:
                    - markdown
                    type: string
                type: object
              cover:
                description: 'cover is the cover image, as a reference to a Print:
                  "print:<name>".'
                maxLength: 259
                pattern: ^print:[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              gazetteRef:
                description: |-
                  gazetteRef is the name of the Gazette, in the same namespace, that this
                  Dispatch is published in. A Dispatch belongs to exactly one Gazette.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              publishAt:
                description: |-
                  publishAt is when a Published or Unlisted Dispatch first becomes
                  visible. Unset or in the past means immediately. It is ignored for Draft
                  and Retracted, and once the Dispatch has been visible (status.publishedAt
                  is set) moving it into the future does not hide the Dispatch again.
                format: date-time
                type: string
              scribeRef:
                description: |-
                  scribeRef is the name of the Scribe (author), in the same namespace,
                  who wrote this Dispatch.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              state:
                default: Draft
                description: |-
                  state is the state the author asks for: Draft, Published, Unlisted or
                  Retracted. press reports the resulting status.phase, which is Embargoed
                  while a Published or Unlisted Dispatch waits for publishAt.
                enum:
                - Draft
                - Published
                - Unlisted
                - Retracted
                type: string
              summary:
                description: summary is a short description used in listings and the
                  Wire feed.
                maxLength: 1024
                type: string
              title:
                description: title is the headline of the Dispatch.
                maxLength: 256
                minLength: 1
                type: string
            required:
            - gazetteRef
            - title
            type: object
          status:
            description: status is the state of the Dispatch as observed by press
            properties:
              conditions:
                description: |-
                  conditions describe the Dispatch's current state. "Ready" is False when
                  the Gazette or Scribe it refers to does not exist; "Rendered" is False
                  when its content or theme fails to render.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation that the
                  status reflects.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is the state press decided on: Draft, Embargoed, Published,
                  Unlisted or Retracted.
                enum:
                - Draft
                - Embargoed
                - Published
                - Unlisted
                - Retracted
                type: string
              publishedAt:
                description: |-
                  publishedAt is when the Dispatch first became visible. It never changes
                  once set.
                format: date-time
                type: string
              url:
                description: url is the public address of the Dispatch.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name is the URL slug and must be a DNS label: lowercase
            letters, digits and ''-'', at most 63 characters'
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
